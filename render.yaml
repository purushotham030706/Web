services:
  # Backend API service
  - type: web
    name: puru-portfolio-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000

  # Frontend static web app
  - type: static_site
    name: puru-portfolio-web
    rootDir: client
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
