services:
  # Backend API web service
  - type: web
    name: puru-portfolio-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://puru-portfolio-web.onrender.com
      - key: MONGODB_URI
        sync: false

  # Frontend web service
  - type: web
    name: puru-portfolio-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://puru-portfolio-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
